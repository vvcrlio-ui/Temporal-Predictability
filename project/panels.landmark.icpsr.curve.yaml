model_params: model_params.yaml
preset: timing_full
experiment_id: ffcws-icpsr-grid-curve-v1
data_version: ffcws-icpsr-ard-v2
model_spec_version: nkgrid-models-v1

# B stage: the learning curve that decides whether the tail has flattened.
# The post-calibration reductions were reverted on 2026-08-13 after stage A
# finished in 2h51m. The full design costs about 5.4h, so A+B stays inside the
# 12h budget and none of the plan's reduction rules need to fire.
panels:
  - name: ffc_icpsr_median_mode_gpa_lm0_curve
    schema: schema/ffc_icpsr_median_mode_gpa_lm0.json
    outcome: gpa
    models: [super_learner, ridge, random_forest, lightgbm]
    n_seeds: 4
    n_draws: 4
    n_grid: [100, 300, 737, 1290]
    k_grid: [300, 526]
    n_jobs: 2
    out: outputs/nk_grid_ffc_icpsr_median_mode_gpa_lm0_curve.csv

