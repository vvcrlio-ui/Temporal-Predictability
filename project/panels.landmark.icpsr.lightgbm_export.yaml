model_params: model_params.yaml
preset: timing_full
experiment_id: ffcws-icpsr-lightgbm-export-v1
data_version: ffcws-icpsr-ard-v2
model_spec_version: nkgrid-models-v1

# Targeted rerun: lightgbm is the only candidate learner whose GPA error falls
# from birth to age 5 (-0.0124), and that is right at this design's detection
# limit (~0.011-0.016). The A-stage export whitelist covered super_learner,
# ridge and random_forest only, so no household-paired test is possible for
# lightgbm. This runs the same five full-K endpoint cells with per-row export.
# Same seeds, draws, N and K as panels.landmark.icpsr.endpoints.yaml, so the
# aggregate rmse values must reproduce that run cell for cell.

panels:
  - name: ffc_icpsr_median_mode_gpa_lm0_lgbm
    schema: schema/ffc_icpsr_median_mode_gpa_lm0.json
    outcome: gpa
    models: [lightgbm]
    n_seeds: 4
    n_draws: 4
    n_grid: [1843]
    k_grid: [526]
    n_jobs: 2
    out: outputs/nk_grid_ffc_icpsr_median_mode_gpa_lm0_lgbm.csv
    prediction_export_cells:
      - {model: lightgbm, N: 1843, K: 526}

  - name: ffc_icpsr_median_mode_gpa_lm1_lgbm
