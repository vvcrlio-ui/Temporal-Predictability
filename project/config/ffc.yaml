contract_version: ffcws-adapter-v1
split_mode: external_test
feature_universe_mode: train_pool_screened

paths:
  background: ../data/private/background.dta
  train: ../data/private/train.csv
  test: ../data/private/test.csv
  output_root: ../data/adapter_work
  ard_root: ../data/ard
  schema_root: ../schema

id_column: challengeID
outcomes:
  - gpa
  - grit
  - materialHardship
  - eviction
  - layoff
  - jobTraining

# 只启用一种特征表示。另外两种（median_missing_indicator、tree_ordinal）
# 是根目录 README.md 研究问题 5「结论对分类编码与缺失表示是否稳健」的材料；
# 需要时把它们加回本列表重跑 adapter 即可重新生成，不必改代码。
strategies:
  - median_mode

missing_value_codes:
  - -9
  - -8
  - -7
  - -6
  - -5
  - -4
  - -3
  - -2
  - -1

exchangeability_justification: >-
  The N×K feature-availability estimand samples eligible, outcome-free
  background-variable sources screened from the official training pool.
  One-hot columns from the same raw categorical variable remain atomic.

schema:
  min_valid_rate: 0.5
  min_numeric_fraction: 0.95
  categorical_max_levels: 15
  min_binary_prevalence: 0.01

# Test-only unknown categories are normally reported and mapped to NaN.
# This ceiling is intentionally high and catches broken mappings/joins.
unknown_rate_threshold: 0.95
