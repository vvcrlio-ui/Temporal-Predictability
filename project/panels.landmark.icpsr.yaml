model_params: model_params.yaml
preset: medium
experiment_id: ffcws-icpsr-rebuild-v1
data_version: ffcws-icpsr-ard-v1
model_spec_version: nkgrid-models-v1

# This rebuild panel intentionally contains only the measured full-N/full-K
# endpoint for each landmark. Intermediate N/K grid cells remain a research
# design decision and are not inferred from the retired Challenge pilot grid.
panels:
