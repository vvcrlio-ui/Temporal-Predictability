    schema: schema/ffc_icpsr_median_mode_gpa_lm0.json
    outcome: gpa
    models: [ridge, lasso, random_forest, extra_trees, xgboost, lightgbm, super_learner]
    n_seeds: 4
    n_draws: 4
    n_grid: [1843]
    k_grid: [1475]
